<!-- Favicons -->
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="{{ site.baseurl }}/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/favicon-192x192.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
<link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico">
<meta name="theme-color" content="#ffffff">

<!-- Override OG image (overrides Minimal Mistakes default which picks the banner) -->
{% assign _og_image = "https://bksubhuti.github.io/orthodoxtheravada/images/og-social.png" %}
<meta property="og:image"        content="{{ _og_image }}">
<meta property="og:image:width"  content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:image"       content="{{ _og_image }}">
