<!-- Favicons -->
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Open Graph / Social Preview -->
{% assign og_title = page.title | default: site.title %}
{% assign og_desc  = page.description | default: page.excerpt | default: site.description %}
{% assign og_image = "https://bksubhuti.github.io/orthodoxtheravada/images/og-social.png" %}
{% assign og_url   = page.url | absolute_url %}

<meta property="og:type"        content="website">
<meta property="og:site_name"   content="Orthodox Theravada">
<meta property="og:title"       content="{{ og_title }}">
<meta property="og:description" content="{{ og_desc | strip_html | truncate: 160 }}">
<meta property="og:image"       content="{{ og_image }}">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:url"         content="{{ og_url }}">

<!-- Twitter Card -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_desc | strip_html | truncate: 160 }}">
<meta name="twitter:image"       content="{{ og_image }}">

<!-- Schema.org -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Orthodox Theravada",
  "url": "https://bksubhuti.github.io/orthodoxtheravada/",
  "logo": "https://bksubhuti.github.io/orthodoxtheravada/favicon-192x192.png",
  "image": "{{ og_image }}"
}
</script>
