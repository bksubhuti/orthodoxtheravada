name: Deploy Website

on:
  push:
    branches:
      - main

# Allows this workflow to securely stream the built site directly into GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple deployments from running simultaneously and breaking
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: |
          gem install jekyll bundler
          bundle install

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # Uploads the generated HTML and JSON silently

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
