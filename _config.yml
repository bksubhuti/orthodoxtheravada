# --------------------------------------------------
# Site settings
# --------------------------------------------------

title: Orthodox Theravāda
email: [EMAIL_ADDRESS]
description: "A website dedicated to Orthodox Theravāda Buddhism."
baseurl: "" # for custom domain
url: "https://orthodoxtheravada.org"
logo: /images/orthodox_theravada_logo.png
og_image: /images/orthodox_theravada_logo.png

# Optional (SEO + clarity)
twitter_username: ""
github_username: ""
facebook_username: ""
website: ""

# --------------------------------------------------
# Navigation menu
# --------------------------------------------------
# You can add this section directly (replaces `navigation: main`)




  
sass:
  sass_dir: assets/css
  style: compressed

# --------------------------------------------------
# Theme settings
# --------------------------------------------------



defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false
      header:
        overlay_image: /images/plain_orthodox_banner4.jpg
        overlay_color: "#333"
        overlay_filter: 0.3
        og_image: /images/og-social.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: false
      header:
        overlay_image: /images/plain_orthodox_banner4.jpg
        overlay_color: "#333"
        overlay_filter: 0.3
        og_image: /images/og-social.png
  - scope:
      path: ""
      type: "articles"
    values:
      layout: single
      author_profile: false
      header:
        overlay_image: /images/plain_orthodox_banner4.jpg
        overlay_color: "#333"
        overlay_filter: 0.3
        og_image: /images/og-social.png
  - scope:
      path: ""
      type: "terms"
    values:
      layout: single
      author_profile: false
      header:
        overlay_image: /images/plain_orthodox_banner4.jpg
        overlay_color: "#333"
        overlay_filter: 0.3
        og_image: /images/og-social.png
  - scope:
      path: ""
      type: "lists"
    values:
      layout: single
      author_profile: false
      header:
        overlay_image: /images/plain_orthodox_banner4.jpg
        overlay_color: "#333"
        overlay_filter: 0.3
        og_image: /images/og-social.png


# --------------------------------------------------
# Plugins and theme
# --------------------------------------------------

remote_theme: "mmistakes/minimal-mistakes"  # used by GitHub Pages
# theme: "minimal-mistakes-jekyll"           # used locally (overridden by _config_local.yml)

plugins:
  - jekyll-feed
  - jekyll-sitemap       # ✅ helps SEO
  - jekyll-include-cache
  - jekyll-remote-theme


atom_feed:
  hide: true
footer:
  custom: true

collections:
  articles:
    output: true
    permalink: /:title/
  terms:
    output: true
    permalink: /glossary/:title/
  lists:
    output: true
    permalink: /lists/:title/

