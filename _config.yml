# --------------------------------------------------
# Site settings
# --------------------------------------------------

title: Orthodox Theravada
email: info@orthodoxtheravada.org
description: "A website dedicated to Orthodox Theravada Buddhism."
baseurl: "/orthodoxtheravada" # for GitHub Pages project site
url: "https://bksubhuti.github.io"

# Optional (SEO + clarity)
twitter_username: ""
github_username: ""
facebook_username: ""
website: "https://americanmonk.org"

# --------------------------------------------------
# Navigation menu
# --------------------------------------------------
# You can add this section directly (replaces `navigation: main`)




  
sass:
  sass_dir: assets/css
  style: compressed

# --------------------------------------------------
# Theme settings
# --------------------------------------------------
collections:
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/


defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false

# --------------------------------------------------
# Plugins and theme
# --------------------------------------------------

remote_theme: "mmistakes/minimal-mistakes"
#theme: "minimal-mistakes-jekyll"

plugins:
  - jekyll-feed
  - jekyll-sitemap       # ✅ helps SEO
  - jekyll-include-cache
  - jekyll-remote-theme


atom_feed:
  hide: true
footer:
  custom: true

# --------------------------------------------------
